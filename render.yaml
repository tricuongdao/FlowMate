# Render one-click deploy (single service: backend serves the built frontend).
# Render auto-detects this file when you choose "Blueprint" on import.

services:
  - type: web
    name: flowmate
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
